name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chronforge-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ChronForge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Verification doctor
        run: bash tools/verify/doctor.sh

      - name: Control-plane profile
        run: bash tools/verify/verify.sh control-plane

      - name: D0 receipt profile
        run: bash tools/verify/verify.sh d0

      - name: Deterministic repeat helper self-test
        run: |
          python3 tools/verify/repeat_hash.py -n 3 -- python3 -c 'print("stable")'
          if python3 tools/verify/repeat_hash.py -n 3 -- python3 -c 'import os; print(os.environ["CHRONFORGE_VERIFY_RUN_INDEX"])'; then
            echo 'repeat_hash failed to detect divergent canonical output' >&2
            exit 1
          fi

name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openspec-and-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ChronForge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Strict OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.13.0 validate --all --strict

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Workspace compile check
        run: cargo check --workspace

      - name: Control-plane dependency guard
        run: |
          if grep -RInE '(^|[^A-Za-z0-9_-])(qstack|qorch|pstack|openspec)([^A-Za-z0-9_-]|$)' crates/*/Cargo.toml; then
            echo 'Runtime crates must not depend on qstack/qorch/pstack/OpenSpec.' >&2
            exit 1
          fi
